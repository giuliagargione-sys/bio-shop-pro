<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Na Bio Que Vende</title>
    <meta
      name="description"
      content="Monte a sua loja no link da bio: capa, produtos, quiz de estilo e captura de leads — tudo em uma página só, com uma dashboard fácil de personalizar."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Urbanist + Epilogue: identidade visual do produto (login/dashboard/landing).
         As demais fontes desta lista ficam disponíveis pra aluna escolher pra
         LOJA dela, na aba "Estrutura e visual" da dashboard. -->
    <!-- Carregamento assíncrono: a fonte não bloqueia a primeira renderização
         (o PageSpeed apontou ~1,3 s de bloqueio de renderização aqui). -->
    <link
      href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Epilogue:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Epilogue:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=Lora:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
      />
